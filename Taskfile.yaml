version: "3"

tasks:
  serve:
    desc: "Serve working Hugo content with exact-case compatibility assets (includes drafts)"
    aliases: [default, "hugo:serve"]
    cmds:
      - 'uv run --locked python -m scripts.migration.authoring serve {{.CLI_ARGS}}'

  build:
    desc: "Build the current working Hugo preview (published content only)"
    aliases: ["hugo:build"]
    cmds:
      - 'uv run --locked python -m scripts.migration.authoring build {{.CLI_ARGS}}'

  build-all:
    desc: "Build the complete immutable production artifact from all manifest pins"
    cmds:
      - >-
        uv run --locked python scripts/build-versions.py
        --manifest migration/release-sources.yaml
        --base-url https://www.virtuozzo.com/cloudscripting-docs/
        --output-dir "${CS_BUILD_ROOT:-build}/artifact"
        --report "${CS_BUILD_ROOT:-build}/build-versions.json"
        --jobs "${CS_BUILD_JOBS:-1}"

  validate:
    desc: "Validate the assembled complete artifact offline (does not approve deployment)"
    cmds:
      - >-
        uv run --locked python -m scripts.migration.check_artifact
        --artifact-dir "${CS_BUILD_ROOT:-build}/artifact"
        --manifest migration/release-sources.yaml
        --report "${CS_BUILD_ROOT:-build}/artifact-validation.json"

  hugo:verify:
    desc: "Build root/prefix fixtures and verify Hugo foundation behavior"
    cmds:
      - 'uv run --locked python tests/fixtures/hugo-foundation/verify.py'
