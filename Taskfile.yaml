version: "3"

tasks:
  build:
    desc: "Build the documentation"
    cmds:
      - hugo

  serve:
    desc: "Start the development server"
    aliases: [default]
    cmds:
      - |-
        if [ -z "${CODESPACE_NAME}" ]; then
            hugo server -b 'http://127.0.0.1/' --buildDrafts --watch
        else
            hugo server --appendPort=false --buildDrafts --watch -p 1313 --liveReloadPort 443 -b "https://${CODESPACE_NAME}-1313.app.github.dev/"
        fi