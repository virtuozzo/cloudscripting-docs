artifact_contract:
  status: derived
  source: docs/deployment.md
  layout: [site/, artifact.json, checksums.sha256, validation/]
  validation: Complete non-preview artifact; check_artifact and per-release checks pass; no drafts.
  retained_set: All retained records from reviewed migration/release-sources.yaml plus served-tree reconciliation; never infer from directory ordering.
  separate_root_and_latest: true
  exact_case_assets: true
  promotion: Same validated archive SHA-256 staged and promoted; no rebuilding, theme pull or post-transfer edits.
  digests:
    approved_archive_sha256: null
    artifact_identity: null
    staging_acceptance_record: null
    production_received_sha256: null
  managed_files: Explicit path inventory outside artifact ownership; collision refuses deployment. Record combined served-tree manifest separately.
  strategy:
    preferred: Immutable release directories with an already configured atomic symlink pointer.
    fallback: Conditional same-filesystem directory rename under maintenance; two renames are not atomic. No blanket rsync --delete.
redirect_contract:
  status: derived
  source_host: docs.cloudscripting.com
  target_base: https://www.virtuozzo.com/cloudscripting-docs/
  requirements:
    - Retain every supported path, release prefix, image filename case and original query string.
    - Use a host-scoped permanent redirect after staging rehearsal; avoid double-prefixes and loops.
    - Location must not introduce or replace a fragment; the browser must inherit its original fragment.
    - Preserve /search.html?q=... semantics and per-version GET/HEAD navigation.
    - Preserve root and explicit latest as different URLs and content identities.
    - Keep old-domain TLS valid and certificate renewal routed correctly throughout redirect service.
    - Resolve missing paths with a real 404; never silently route all missing releases to root.
  browser_example:
    from: 'https://docs.cloudscripting.com/8.15.1/creating-manifest/actions/?q=example#oninstall'
    to: 'https://www.virtuozzo.com/cloudscripting-docs/8.15.1/creating-manifest/actions/?q=example#oninstall'
  installed_rules_and_host_tests: null
