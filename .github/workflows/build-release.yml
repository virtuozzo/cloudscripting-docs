name: Build complete Hugo release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: '.python-version'
      - run: bash scripts/deploy/setup-ci.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.28'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests/migration
      - name: Assemble root and every retained release from immutable pins
        run: task build-all
      - run: task validate
      - name: Package the validated complete artifact once
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python -m scripts.deploy.artifact package build/artifact migration/release-sources.yaml build/delivery/cloudscripting-docs.tar.gz build/delivery/package-validation.json
          digest=$(cut -d ' ' -f 1 build/delivery/cloudscripting-docs.tar.gz.sha256)
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: cloudscripting-docs-release
          path: build/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record exact promotion identities
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          GITHUB_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          printf 'Build run: `%s`\n\nArtifact ID: `%s`\n\nGitHub artifact digest: `%s`\n\nArchive SHA-256: `%s`\n' "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$GITHUB_ARTIFACT_DIGEST" "$ARCHIVE_SHA256" >> "$GITHUB_STEP_SUMMARY"
