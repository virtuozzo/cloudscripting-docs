name: Hugo checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: '.python-version'
      - run: bash scripts/deploy/setup-ci.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.28'
          enable-cache: true
      - run: uv sync --locked
      - name: Fixture, collision and immutable-export checks on Linux
        run: uv run --locked python -m unittest discover -s tests/migration
      - run: task hugo:verify
      - name: Build current published content with compatibility assets
        run: task build
